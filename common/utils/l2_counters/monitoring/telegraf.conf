#
# One point per counter group, timestamp taken from the file

[agent]
  interval = "${TELEGRAF_INTERVAL}"
  flush_interval = "${TELEGRAF_INTERVAL}"
  precision = "1ms"
  omit_hostname = true

[[inputs.file]]
  files = ["/data/*.json"]
  data_format = "xpath_json"
  xpath_native_types = true

  [[inputs.file.xpath]]
    metric_name = "'l2_counters'"
    metric_selection = "/counters/*"
    timestamp = "/timestamp_ms"
    timestamp_format = "unix_ms"
    field_selection = "*"
    [inputs.file.xpath.tags]
      node = "/node"
      group = "name(.)"

[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "${INFLUX_TOKEN}"
  organization = "oai"
  bucket = "l2_counters"
